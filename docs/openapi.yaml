openapi: 3.0.1
info:
  title: Single Point API
  description: Multi-tenant gated-community ticket management platform.
  version: MVP-8
servers:
- url: http://localhost:18080
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: Me
  description: "Signed-in user profile, theme, memberships, devices"
- name: Super Admin — KYC review
  description: Review a provider's verification documents
- name: Me — Notification preferences
  description: Anti-fatigue controls for promotional offers
- name: Auth
  description: Phone + OTP login and profile completion
- name: Admin — Ticket categories
  description: A community's own ticket categories
- name: Me — Billing
  description: "Your plan, usage against limits, and any due invoices"
- name: Admin — Flats & Invites
  description: Community flat register and invite codes
- name: Me — Household
  description: Flats I belong to and the family members in them
- name: Admin — Join Requests
  description: Approve or reject residents joining the community
- name: Super Admin — Offer approval
  description: Validate every offer + assign its audience
- name: Admin — Community settings
  description: Reopen window and the approval-of-allocation gate
- name: Offers
  description: "Vendor/admin authoring, resident deals feed, redemption"
- name: Admin — Locations
  description: Physical places within a community; flats hang off a location
- name: Super Admin — Ticket categories
  description: Global catalogue + per-community lists
- name: Super Admin
  description: Platform-level tenant onboarding (no ticket content access)
- name: Admin — Members
  description: Community roster and gated removal
- name: Provider — KYC
  description: Provider uploads its own verification documents
- name: Provider — Profile
  description: Provider self-service (name/phone stay admin-only)
- name: Tickets
  description: "Raise, triage, resolve — role-aware"
- name: Admin — Providers
  description: Enrol verified providers into this community
- name: Super Admin — Billing
  description: "Subscription plans, subscriptions, invoices, featured tier"
- name: Providers
  description: Resident-facing directory for direct booking
- name: Communities
  description: Community directory for onboarding
- name: Super Admin — Taxonomy
  description: Manage vendor categories and verticals
- name: Payments — webhook
  description: Gateway payment callbacks
- name: Payments
  description: "Service charge, cash-with-OTP, online payment, receipt"
- name: Membership
  description: Joining a community
- name: Categories
  description: Ticket + vendor category lists
- name: Super Admin — Providers
  description: "Global provider onboarding, verification and tier"
paths:
  /api/v1/tickets/{ticketId}/payment/charge:
    put:
      tags:
      - Payments
      summary: Adjust an unsettled charge
      operationId: adjust
      parameters:
      - name: ticketId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                p:
                  $ref: '#/components/schemas/AppPrincipal'
                body:
                  $ref: '#/components/schemas/ChargeRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PaymentView'
    post:
      tags:
      - Payments
      summary: Add a service charge (admin or the assigned provider)
      operationId: charge
      parameters:
      - name: ticketId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                p:
                  $ref: '#/components/schemas/AppPrincipal'
                body:
                  $ref: '#/components/schemas/ChargeRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PaymentView'
  /api/v1/superadmin/vendor-category-kinds/{id}:
    put:
      tags:
      - Super Admin — Taxonomy
      operationId: renameKind
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/KindView'
  /api/v1/superadmin/vendor-categories/{id}:
    put:
      tags:
      - Super Admin — Taxonomy
      operationId: updateCategory
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CategoryView'
  /api/v1/superadmin/ticket-categories/{id}:
    put:
      tags:
      - Super Admin — Ticket categories
      operationId: update
      parameters:
      - name: tenantId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CategoryView'
  /api/v1/superadmin/tenants/{tenantId}:
    put:
      tags:
      - Super Admin
      summary: Update a community's settings (sparse — only the fields sent are changed)
      operationId: updateTenant
      parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TenantSettingsView'
  /api/v1/superadmin/providers/{providerId}:
    put:
      tags:
      - Super Admin — Providers
      summary: Edit a global provider record
      operationId: update_1
      parameters:
      - name: providerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProviderRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProviderView'
  /api/v1/superadmin/plans/{id}:
    put:
      tags:
      - Super Admin — Billing
      summary: Update a plan's price / entitlements / visibility
      operationId: updatePlan
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlanRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PlanView'
  /api/v1/provider/profile:
    get:
      tags:
      - Provider — Profile
      operationId: get_3
      parameters:
      - name: p
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/AppPrincipal'
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProfileView'
    put:
      tags:
      - Provider — Profile
      summary: "Update contact email, service area, availability"
      operationId: update_2
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                p:
                  $ref: '#/components/schemas/AppPrincipal'
                body:
                  $ref: '#/components/schemas/ProfileUpdateRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProfileView'
  /api/v1/offers/{id}:
    get:
      tags:
      - Offers
      operationId: get_4
      parameters:
      - name: p
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/AppPrincipal'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OfferView'
    put:
      tags:
      - Offers
      operationId: update_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                p:
                  $ref: '#/components/schemas/AppPrincipal'
                body:
                  $ref: '#/components/schemas/CreateOrUpdateRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OfferView'
  /api/v1/me/theme:
    put:
      tags:
      - Me
      summary: Set the user's personal theme preference (overrides tenant default)
      operationId: setTheme
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                principal:
                  $ref: '#/components/schemas/AppPrincipal'
                body:
                  $ref: '#/components/schemas/ThemeRequest'
        required: true
      responses:
        "200":
          description: OK
  /api/v1/me/notification-preferences:
    get:
      tags:
      - Me — Notification preferences
      summary: Get my notification preferences (created with opt-in defaults on first
        read)
      operationId: get_5
      parameters:
      - name: p
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/AppPrincipal'
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PrefView'
    put:
      tags:
      - Me — Notification preferences
      summary: Update notification preferences
      operationId: update_4
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                p:
                  $ref: '#/components/schemas/AppPrincipal'
                body:
                  $ref: '#/components/schemas/UpdateRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PrefView'
  /api/v1/me/away-until:
    put:
      tags:
      - Me
      summary: Mark yourself away until a date (or clear it with a null value)
      operationId: setAwayUntil
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                principal:
                  $ref: '#/components/schemas/AppPrincipal'
                body:
                  $ref: '#/components/schemas/AwayRequest'
        required: true
      responses:
        "200":
          description: OK
  /api/v1/admin/ticket-categories/{id}:
    put:
      tags:
      - Admin — Ticket categories
      operationId: update_5
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                p:
                  $ref: '#/components/schemas/AppPrincipal'
                body:
                  $ref: '#/components/schemas/UpdateRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CategoryView'
  /api/v1/admin/locations/{locationId}:
    put:
      tags:
      - Admin — Locations
      operationId: update_6
      parameters:
      - name: locationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                p:
                  $ref: '#/components/schemas/AppPrincipal'
                body:
                  $ref: '#/components/schemas/UpdateLocationRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LocationView'
  /api/v1/admin/flats/{flatId}:
    put:
      tags:
      - Admin — Flats & Invites
      operationId: updateFlat
      parameters:
      - name: flatId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                p:
                  $ref: '#/components/schemas/AppPrincipal'
                body:
                  $ref: '#/components/schemas/UpdateFlatRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FlatView'
  /api/v1/admin/community-settings:
    get:
      tags:
      - Admin — Community settings
      summary: This community's settings
      operationId: get_7
      parameters:
      - name: principal
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/AppPrincipal'
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TenantSettingsView'
    put:
      tags:
      - Admin — Community settings
      summary: Update the reopen window / approval-of-allocation gate
      operationId: update_7
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                principal:
                  $ref: '#/components/schemas/AppPrincipal'
                body:
                  $ref: '#/components/schemas/CommunitySettingsRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TenantSettingsView'
  /dev/pay/{ref}/settle:
    post:
      tags:
      - dev-payment-controller
      operationId: settle
      parameters:
      - name: ref
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
  /api/v1/tickets:
    get:
      tags:
      - Tickets
      summary: List tickets in scope for the caller's role
      operationId: list
      parameters:
      - name: principal
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/AppPrincipal'
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageResponseTicketView'
    post:
      tags:
      - Tickets
      summary: Raise a ticket (a non-resident may raise only for a flat they own)
      operationId: raise
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                principal:
                  $ref: '#/components/schemas/AppPrincipal'
                body:
                  $ref: '#/components/schemas/RaiseRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TicketView'
  /api/v1/tickets/{ticketId}/payment/waive:
    post:
      tags:
      - Payments
      operationId: waive
      parameters:
      - name: ticketId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                p:
                  $ref: '#/components/schemas/AppPrincipal'
                body:
                  $ref: '#/components/schemas/WaiveRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PaymentView'
  /api/v1/tickets/{ticketId}/payment/mode:
    post:
      tags:
      - Payments
      summary: Resident chooses CASH or ONLINE; ONLINE returns a pay link
      operationId: mode
      parameters:
      - name: ticketId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                p:
                  $ref: '#/components/schemas/AppPrincipal'
                body:
                  $ref: '#/components/schemas/ModeRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PaymentView'
  /api/v1/tickets/{ticketId}/payment/cash/confirm:
    post:
      tags:
      - Payments
      summary: Resident or provider submits the resident's OTP to confirm cash
      operationId: confirm
      parameters:
      - name: ticketId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                p:
                  $ref: '#/components/schemas/AppPrincipal'
                body:
                  $ref: '#/components/schemas/ConfirmCashRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PaymentView'
  /api/v1/tickets/{ticketId}/payment/cash/collect:
    post:
      tags:
      - Payments
      summary: Provider marks cash collected → OTP goes to the resident
      operationId: collect
      parameters:
      - name: ticketId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppPrincipal'
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/StartCashResult'
  /api/v1/tickets/{id}/status:
    post:
      tags:
      - Tickets
      summary: Provider moves the ticket to IN_PROGRESS / ON_HOLD / RESOLVED
      operationId: providerStatus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                p:
                  $ref: '#/components/schemas/AppPrincipal'
                body:
                  $ref: '#/components/schemas/ProviderStatusRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TicketView'
  /api/v1/tickets/{id}/resolve:
    post:
      tags:
      - Tickets
      operationId: resolveDirect
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                p:
                  $ref: '#/components/schemas/AppPrincipal'
                body:
                  $ref: '#/components/schemas/ResolveRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TicketView'
  /api/v1/tickets/{id}/reroute:
    post:
      tags:
      - Tickets
      summary: Reassign to a different provider (same as assign; kept for clarity)
      operationId: reroute
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                p:
                  $ref: '#/components/schemas/AppPrincipal'
                body:
                  $ref: '#/components/schemas/AssignRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TicketView'
  /api/v1/tickets/{id}/reopen:
    post:
      tags:
      - Tickets
      operationId: reopen
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                p:
                  $ref: '#/components/schemas/AppPrincipal'
                body:
                  $ref: '#/components/schemas/RemarksRequest'
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TicketView'
  /api/v1/tickets/{id}/reject:
    post:
      tags:
      - Tickets
      operationId: reject
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                p:
                  $ref: '#/components/schemas/AppPrincipal'
                body:
                  $ref: '#/components/schemas/RejectRequest'
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TicketView'
  /api/v1/tickets/{id}/rebook:
    post:
      tags:
      - Tickets
      summary: Pick a new provider after a direct booking was declined
      operationId: rebook
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                p:
                  $ref: '#/components/schemas/AppPrincipal'
                body:
                  $ref: '#/components/schemas/RebookRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TicketView'
  /api/v1/tickets/{id}/close:
    post:
      tags:
      - Tickets
      operationId: close
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                p:
                  $ref: '#/components/schemas/AppPrincipal'
                body:
                  $ref: '#/components/schemas/CloseRequest'
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TicketView'
  /api/v1/tickets/{id}/attachments:
    get:
      tags:
      - Tickets
      operationId: attachments
      parameters:
      - name: principal
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/AppPrincipal'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttachmentView'
    post:
      tags:
      - Tickets
      summary: Attach a photo / video to a ticket
      operationId: upload
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - file
              type: object
              properties:
                principal:
                  $ref: '#/components/schemas/AppPrincipal'
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AttachmentView'
  /api/v1/tickets/{id}/assign:
    post:
      tags:
      - Tickets
      operationId: assign
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                p:
                  $ref: '#/components/schemas/AppPrincipal'
                body:
                  $ref: '#/components/schemas/AssignRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
