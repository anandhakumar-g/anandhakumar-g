# ============================================================
# Single Point API — TEST profile
#   Integration tests against local PostgreSQL (no Docker).
#   Testcontainers-based tests override the datasource dynamically
#   and are gated on Docker availability.
# ============================================================
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5433/singlepoint_test}
spring.datasource.username=${TEST_DB_USER:singlepoint_app}
spring.datasource.password=${TEST_DB_PASSWORD:singlepoint}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.clean-disabled=false
spring.flyway.locations=classpath:db/migration

logging.level.root=WARN
logging.level.com.singlepoint=INFO

sp.otp.dev-mode=true
sp.crypto.key-provider=local
sp.storage.provider=local
sp.storage.local.base-dir=./target/test-attachments
sp.push.provider=noop
sp.notification.outbox.poll-delay-ms=1000
sp.ticket.auto-close.enabled=false
