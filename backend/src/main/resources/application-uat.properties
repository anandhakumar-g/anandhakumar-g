# ============================================================
# Single Point API — UAT profile
#   Production-like wiring (env-driven DB, Flyway validate, INFO logs) but the
#   external providers stay on the built-in stubs so end-to-end testing needs
#   no SMS gateway, no payment gateway and no cloud storage.
#   Flip individual providers to "real" by setting their env vars + provider key.
# ============================================================

# ---- Datasource (required) ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:15}

# ---- Schema safety ----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:db/migration

logging.level.root=INFO
logging.level.com.singlepoint=INFO
server.ssl.enabled=${SSL_ENABLED:false}

# ---- CORS: the console origin(s), comma-separated ----
sp.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ---- OTP: on-screen code by default (no SMS gateway needed for UAT) ----
#   Set OTP_DEV_MODE=false + OTP_PROVIDER/MSG91_* to test real SMS delivery.
sp.otp.dev-mode=${OTP_DEV_MODE:true}
sp.otp.provider=${OTP_PROVIDER:log}
sp.otp.msg91.auth-key=${MSG91_AUTH_KEY:}
sp.otp.msg91.template-id=${MSG91_TEMPLATE_ID:}

# ---- Crypto: local keyring — MUST override the two keys per environment ----
sp.crypto.key-provider=${CRYPTO_KEY_PROVIDER:local}
sp.crypto.aes-key=${SP_AES_KEY}
sp.crypto.hmac-key=${SP_HMAC_KEY}
sp.crypto.key-version=${SP_CRYPTO_KEY_VERSION:1}

# ---- Storage: files on the server disk (set STORAGE_PROVIDER=s3 + S3_* for S3) ----
sp.storage.provider=${STORAGE_PROVIDER:local}
sp.storage.local.base-dir=${STORAGE_LOCAL_DIR:/var/lib/single-point/attachments}
sp.storage.local.public-base-url=${STORAGE_PUBLIC_URL:${PUBLIC_API_URL:http://localhost:8080}/api/v1/files}

# ---- Push: Expo (free, no credentials) ----
sp.push.provider=${PUSH_PROVIDER:expo}

# ---- WhatsApp: log only (set WHATSAPP_PROVIDER=meta + WHATSAPP_META_* for real) ----
sp.whatsapp.provider=${WHATSAPP_PROVIDER:log}
sp.whatsapp.meta.token=${WHATSAPP_META_TOKEN:}
sp.whatsapp.meta.phone-number-id=${WHATSAPP_META_PHONE_NUMBER_ID:}

# ---- Payments: stub gateway — /dev/pay/** settle endpoints drive the flow ----
sp.payment.provider=${PAYMENT_PROVIDER:stub}
sp.payment.stub-secret=${PAYMENT_STUB_SECRET:uat-stub-secret-change-me}

# ---- Automated backups: off (this is not production). See docs/ops-runbook.md. ----
sp.backup.enabled=false

# ---- First-boot Super Admin (optional; else seed via the console onboarding flow) ----
sp.bootstrap.super-admin-phone=${SUPER_ADMIN_PHONE:}
sp.bootstrap.super-admin-name=${SUPER_ADMIN_NAME:Platform Owner}
