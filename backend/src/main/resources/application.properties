# ============================================================
# Single Point API — base config (profile-independent)
# ============================================================
spring.application.name=single-point-api
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.port=${PORT:8080}
server.servlet.context-path=/
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

# ---- Jackson ----
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false

# ---- JPA / Hibernate (shared) ----
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---- Flyway ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ---- springdoc / Swagger ----
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ============================================================
# Application constants  (sp.* namespace)
# ============================================================
sp.jwt.secret=${JWT_SECRET:localDevSinglePointJwtSecretAtLeast32CharsLong!!}
sp.jwt.ttl-seconds=${JWT_TTL_SECONDS:86400}
sp.jwt.issuer=single-point

# OTP (login + future cash-payment confirmation)
sp.otp.length=6
sp.otp.ttl-seconds=300
sp.otp.max-attempts=5
sp.otp.resend-cooldown-seconds=30
sp.otp.rate-limit.per-phone-per-hour=5
# dev-mode: also return the code in the verify-request response and log it (never in cloud)
sp.otp.dev-mode=${OTP_DEV_MODE:true}

# Crypto (PII field encryption)
sp.crypto.key-provider=${CRYPTO_KEY_PROVIDER:local}
# Base64 of a 32-byte AES key. Default = Base64("localDevSinglePointAesKey32bytes")
sp.crypto.aes-key=${SP_AES_KEY:bG9jYWxEZXZTaW5nbGVQb2ludEFlc0tleTMyYnl0ZXM=}
# Base64 HMAC key for deterministic phone_hash lookup
sp.crypto.hmac-key=${SP_HMAC_KEY:bG9jYWxEZXZTaW5nbGVQb2ludEhtYWNLZXkzMmJ5dGVz}

# Ticket defaults
sp.ticket.default-reopen-window-hours=72
sp.ticket.auto-close.enabled=true
sp.ticket.auto-close.cron=0 15 * * * *

# Notification outbox poller
sp.notification.outbox.poll-delay-ms=5000
sp.notification.outbox.batch-size=50
sp.notification.outbox.max-attempts=6

# Attachments
sp.storage.provider=${STORAGE_PROVIDER:local}
sp.storage.local.base-dir=${STORAGE_LOCAL_DIR:./local-attachments}
sp.storage.local.public-base-url=${STORAGE_PUBLIC_URL:http://localhost:8080/api/v1/files}
sp.storage.max-file-bytes=26214400
sp.storage.allowed-content-types=image/jpeg,image/png,image/webp,image/heic,video/mp4,video/quicktime

# Super Admin bootstrap (used by cloud profile; local profile seeds via migration V4)
sp.bootstrap.super-admin-phone=${SUPER_ADMIN_PHONE:}
sp.bootstrap.super-admin-name=${SUPER_ADMIN_NAME:Platform Owner}

# Push
sp.push.provider=${PUSH_PROVIDER:expo}
sp.push.expo.endpoint=https://exp.host/--/api/v2/push/send

# Payments
sp.payment.provider=${PAYMENT_PROVIDER:stub}
sp.payment.currency=${PAYMENT_CURRENCY:INR}
sp.payment.stub-secret=${PAYMENT_STUB_SECRET:local-stub-secret}
sp.payment.expiry.cron=0 20 * * * *

# Billing / subscriptions (MVP-4)
sp.billing.grace-days=${BILLING_GRACE_DAYS:7}
sp.billing.currency=${BILLING_CURRENCY:INR}
sp.billing.renewal.cron=0 40 2 * * *
