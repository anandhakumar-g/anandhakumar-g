# ============================================================
# Single Point API — CLOUD profile
#   All sensitive values come from the environment with NO defaults.
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:db/migration

logging.level.root=INFO
logging.level.com.singlepoint=INFO

server.ssl.enabled=${SSL_ENABLED:false}

# ---- Secrets / crypto ----
sp.crypto.key-provider=cloud
sp.crypto.aws-secret-name=${AWS_CRYPTO_SECRET_NAME}
sp.crypto.aws-region=${AWS_REGION:ap-south-1}

# ---- OTP: must be a real provider in cloud ----
sp.otp.dev-mode=false
sp.otp.provider=${OTP_PROVIDER:msg91}
sp.otp.msg91.auth-key=${MSG91_AUTH_KEY:}
sp.otp.msg91.template-id=${MSG91_TEMPLATE_ID:}

# ---- Storage ----
sp.storage.provider=s3
sp.storage.s3.bucket=${S3_ATTACHMENTS_BUCKET}
sp.storage.s3.kyc-bucket=${S3_KYC_BUCKET:${S3_ATTACHMENTS_BUCKET}}
sp.storage.s3.region=${AWS_REGION:ap-south-1}
sp.storage.s3.presign-ttl-seconds=900

# ---- Push ----
sp.push.provider=${PUSH_PROVIDER:expo}
sp.push.fcm.service-account-json=${FCM_SERVICE_ACCOUNT_JSON:}

# ---- WhatsApp (Meta Cloud API) ----
sp.whatsapp.provider=${WHATSAPP_PROVIDER:meta}
sp.whatsapp.meta.token=${WHATSAPP_META_TOKEN}
sp.whatsapp.meta.phone-number-id=${WHATSAPP_META_PHONE_NUMBER_ID}
sp.whatsapp.meta.template=${WHATSAPP_META_TEMPLATE:sp_ticket_update}

# ---- Payments ----
sp.payment.provider=razorpay
sp.payment.currency=${PAYMENT_CURRENCY:INR}
sp.payment.razorpay.key-id=${RAZORPAY_KEY_ID}
sp.payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET}
sp.payment.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET}

# ---- CORS ----
sp.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ---- Super Admin bootstrap ----
sp.bootstrap.super-admin-phone=${SUPER_ADMIN_PHONE}
