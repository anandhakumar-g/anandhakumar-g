# ============================================================
# Single Point API — LOCAL profile
#   mvn spring-boot:run -Dspring-boot.run.profiles=local
# ============================================================

# ---- Database: local PostgreSQL on 5433 ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/singlepoint}
spring.datasource.username=${DB_USER:singlepoint_app}
spring.datasource.password=${DB_PASSWORD:singlepoint}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Demo data is created by BootstrapService (@Profile("local")) via the real
# CryptoService so PII encryption/hashing stays consistent — not by SQL seed.
sp.bootstrap.dev-seed=true

# ---- Logging ----
logging.level.root=INFO
logging.level.com.singlepoint=DEBUG
logging.level.org.hibernate.SQL=WARN

# ---- Local-only relaxations ----
# 8080/8081/8090 are taken on this machine (DCC middleware, Wondershare); use 18080/18081.
server.port=${PORT:18080}
management.server.port=${MANAGEMENT_PORT:18081}
sp.storage.local.public-base-url=${STORAGE_PUBLIC_URL:http://localhost:18080/api/v1/files}
server.ssl.enabled=false
sp.otp.dev-mode=true
sp.crypto.key-provider=local
sp.storage.provider=local
sp.push.provider=noop
